<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>泡泡水能量 AR · 空間定錨版</title>
  <!-- 載入純淨版 A-Frame 1.5.0 負責 3D 空間座標與四元數精準定錨 -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05080f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans JP", "Noto Sans TC", sans-serif;
      color: #ffffff;
    }

    /* 3D 預覽模式深海光暈背景（開啟實景相機後自動透明） */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(0, 145, 255, 0.24) 0%, rgba(5, 12, 26, 0.94) 68%, #02050a 100%);
      z-index: -2;
      transition: opacity 0.35s ease;
    }
    body.ar-active {
      background-color: transparent;
    }
    body.ar-active::before {
      opacity: 0;
    }

    /* 實景相機視訊層 */
    #ar-camera-feed {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
      display: none;
      background: #000000;
    }

    /* A-Frame 3D 畫布 */
    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 10;
    }

    /* ==========================================
       左上角空間定錨狀態 HUD 面板（方便向老師展示座標與定錨狀態）
       ========================================== */
    #hud-panel {
      position: fixed;
      top: 14px;
      left: 14px;
      background: rgba(8, 18, 34, 0.86);
      border: 1px solid rgba(0, 215, 255, 0.42);
      padding: 10px 13px;
      border-radius: 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      max-width: 56vw;
    }
    .hud-header {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .badge-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #29e0ff, #0066ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.75);
      flex-shrink: 0;
    }
    .badge-title {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
      line-height: 1.2;
    }
    .badge-sub {
      font-size: 9px;
      color: #66d9ff;
      letter-spacing: 0.7px;
      font-weight: 700;
    }

    /* 定錨狀態與即時世界座標讀數 */
    .anchor-telemetry {
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 11px;
      line-height: 1.45;
    }
    .status-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      color: #8ceeff;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38d6ff;
      box-shadow: 0 0 8px #38d6ff;
      flex-shrink: 0;
    }
    .status-dot.aiming {
      background: #ffcc00;
      box-shadow: 0 0 8px #ffcc00;
      animation: pulseDot 1s infinite alternate;
    }
    .status-dot.locked {
      background: #00ff88;
      box-shadow: 0 0 10px #00ff88;
    }
    @keyframes pulseDot {
      from { transform: scale(0.8); opacity: 0.65; }
      to { transform: scale(1.25); opacity: 1; }
    }
    .coord-readout {
      font-family: "SF Mono", "Roboto Mono", Menlo, monospace;
      font-size: 10px;
      color: #a8d8f0;
      margin-top: 3px;
      letter-spacing: 0.2px;
    }

    /* ==========================================
       右上角控制按鈕區
       ========================================== */
    #top-right-controls {
      position: fixed;
      top: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      z-index: 1000;
    }
    .top-btn {
      background: rgba(10, 22, 40, 0.88);
      border: 1px solid rgba(0, 210, 255, 0.48);
      color: #78e8ff;
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
      white-space: nowrap;
    }
    .top-btn:active {
      transform: scale(0.95);
    }
    .top-btn.active {
      background: linear-gradient(135deg, #3ae8ff, #009dff);
      color: #021324;
      border-color: #aef8ff;
      box-shadow: 0 0 18px rgba(0, 185, 255, 0.85);
    }
    #btn-reanchor {
      display: none;
      background: rgba(14, 38, 64, 0.92);
      border-color: #00ffaa;
      color: #88ffd8;
    }
    #btn-webxr {
      display: none;
      background: linear-gradient(135deg, rgba(16, 48, 82, 0.94), rgba(8, 28, 52, 0.94));
      border-color: #66e0ff;
      color: #ccf6ff;
    }

    /* ==========================================
       螢幕中央定錨準星（Aiming Reticle HUD）
       ========================================== */
    #aim-reticle-hud {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 170px;
      height: 170px;
      pointer-events: none;
      z-index: 850;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #aim-reticle-hud.visible {
      display: flex;
    }
    .reticle-ring {
      position: absolute;
      inset: 0;
      border: 2.5px dashed rgba(64, 232, 255, 0.9);
      border-radius: 50%;
      box-shadow: 0 0 24px rgba(0, 215, 255, 0.45), inset 0 0 18px rgba(0, 215, 255, 0.25);
      animation: spinReticle 8s linear infinite;
    }
    .reticle-inner {
      width: 44px;
      height: 44px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 180, 255, 0.18);
      box-shadow: 0 0 15px rgba(0, 225, 255, 0.8);
    }
    .reticle-dot {
      width: 8px;
      height: 8px;
      background: #00ffaa;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ffaa;
    }
    .reticle-label {
      position: absolute;
      bottom: -36px;
      background: rgba(6, 18, 34, 0.9);
      border: 1px solid rgba(56, 214, 255, 0.65);
      color: #a8f4ff;
      font-size: 11.5px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }
    @keyframes spinReticle {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ==========================================
       畫面邊緣空間錨點方向指引雷達（證明物件定錨在真實空間中）
       ========================================== */
    #offscreen-indicator {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(6, 20, 38, 0.92);
      border: 1.5px solid #00e5ff;
      color: #dffaff;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      box-shadow: 0 0 22px rgba(0, 200, 255, 0.65);
      z-index: 920;
      display: none;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      white-space: nowrap;
    }
    #offscreen-indicator.visible {
      display: flex;
    }

    /* ==========================================
       非侵入式系統訊息框
       ========================================== */
    #status-toast {
      position: fixed;
      top: 108px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      background: rgba(6, 18, 34, 0.94);
      border: 1px solid rgba(56, 214, 255, 0.7);
      color: #e4fbff;
      padding: 9px 16px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
      text-align: center;
      max-width: 88vw;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 14px rgba(0, 195, 255, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 1100;
    }
    #status-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ==========================================
       全螢幕水流「沖刷」雙層波浪特效層
       ========================================== */
    #wash-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 900;
      overflow: hidden;
    }
    .wash-wave {
      position: absolute;
      left: -10%;
      width: 120%;
      height: 130vh;
      bottom: -140vh;
      background: linear-gradient(
        180deg,
        rgba(225, 253, 255, 0.88) 0%,
        rgba(56, 214, 255, 0.56) 8%,
        rgba(0, 145, 255, 0.36) 35%,
        rgba(0, 90, 200, 0.16) 75%,
        transparent 100%
      );
      border-top: 4px solid #ffffff;
      border-radius: 45% 48% 0 0 / 60px 80px 0 0;
      box-shadow: 0 -15px 40px rgba(0, 225, 255, 0.82), inset 0 20px 50px rgba(255, 255, 255, 0.68);
      opacity: 0;
    }
    .wash-wave.secondary {
      border-radius: 52% 42% 0 0 / 75px 50px 0 0;
      background: linear-gradient(180deg, rgba(140, 245, 255, 0.62) 0%, rgba(0, 175, 255, 0.32) 25%, transparent 80%);
      border-top: 2px solid rgba(180, 250, 255, 0.82);
    }
    #wash-overlay.washing .wash-wave.primary {
      animation: waveWashUp 1.15s cubic-bezier(0.22, 0.8, 0.36, 1) forwards;
    }
    #wash-overlay.washing .wash-wave.secondary {
      animation: waveWashUp 1.3s cubic-bezier(0.22, 0.8, 0.36, 1) 0.12s forwards;
    }
    @keyframes waveWashUp {
      0% { bottom: -135vh; opacity: 0.95; transform: rotate(-1.5deg); }
      50% { opacity: 0.92; transform: rotate(1.5deg); }
      100% { bottom: 115vh; opacity: 0; transform: rotate(-1deg); }
    }
    .wash-bubble {
      position: absolute;
      bottom: -30px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, rgba(120, 240, 255, 0.55) 60%, rgba(0, 160, 255, 0.82));
      border: 1px solid rgba(255, 255, 255, 0.88);
      box-shadow: 0 0 10px rgba(0, 220, 255, 0.8);
      animation: bubbleSurge var(--dur, 1.1s) ease-out forwards;
    }
    @keyframes bubbleSurge {
      0% { transform: translateY(0) scale(0.5); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-115vh) translateX(var(--drift, 20px)) scale(1.2); opacity: 0; }
    }

    /* ==========================================
       中央藍色發光數字與招式爆發橫幅
       ========================================== */
    #burst-overlay {
      position: fixed;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      opacity: 0;
      z-index: 950;
      width: 100%;
      text-align: center;
    }
    #burst-overlay.show {
      animation: burstPop 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .burst-main-text {
      font-size: clamp(32px, 6.8vw, 56px);
      font-weight: 900;
      letter-spacing: 3px;
      color: #e6fbff;
      text-shadow: 0 0 12px #00e5ff, 0 0 28px #0099ff, 0 0 50px #0066ff, 0 4px 10px rgba(0, 15, 35, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      white-space: nowrap;
    }
    .burst-drop {
      color: #38d6ff;
      filter: drop-shadow(0 0 12px #00c8ff);
      font-size: 0.95em;
    }
    .burst-sub-pill {
      margin-top: 8px;
      padding: 6px 20px;
      background: rgba(6, 18, 32, 0.88);
      border: 1.5px solid rgba(56, 214, 255, 0.68);
      border-radius: 999px;
      font-size: clamp(11.5px, 2.2vw, 15px);
      font-weight: 800;
      letter-spacing: 2.2px;
      color: #70ebff;
      box-shadow: 0 0 18px rgba(0, 195, 255, 0.55);
    }
    @keyframes burstPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.45); }
      12% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
      22% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      78% { opacity: 1; transform: translate(-50%, -50%) scale(1.02); }
      100% { opacity: 0; transform: translate(-50%, -56%) scale(1.08); }
    }

    /* ==========================================
       底部主控按鈕與操作提示
       ========================================== */
    #bottom-controls {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      z-index: 1000;
      width: 90%;
      max-width: 370px;
    }

    #btn-lock-anchor {
      width: 100%;
      padding: 15px 20px;
      font-size: 16px;
      font-weight: 900;
      color: #021a12;
      background: linear-gradient(90deg, #4dffb8, #00e5ff);
      border: 1.5px solid #ffffff;
      border-radius: 16px;
      box-shadow: 0 6px 26px rgba(0, 255, 170, 0.65);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s ease;
    }
    #btn-lock-anchor:active {
      transform: scale(0.96);
    }

    #btn-trigger {
      width: 100%;
      padding: 14px 20px;
      font-size: 15.5px;
      font-weight: 800;
      color: #031526;
      background: linear-gradient(90deg, #52f2ff, #00aaff);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 16px;
      box-shadow: 0 6px 25px rgba(0, 200, 255, 0.65);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s ease;
    }
    #btn-trigger:active {
      transform: scale(0.96);
    }

    .hint-pill {
      background: rgba(10, 20, 36, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11.5px;
      color: #cce8fa;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-align: center;
      line-height: 1.35;
    }
    .hint-pill span {
      color: #4df0ff;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <!-- 左上角空間定錨狀態 HUD 面板 -->
  <div id="hud-panel">
    <div class="hud-header">
      <div class="badge-icon">💧</div>
      <div>
        <div class="badge-title">泡泡水能量 AR</div>
        <div class="badge-sub">WORLD-LOCKED SPATIAL ANCHOR</div>
      </div>
    </div>
    <div class="anchor-telemetry">
      <div class="status-line">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">3D 預覽模式（可開啟鏡頭定錨）</span>
      </div>
      <div id="coord-readout" class="coord-readout">ANCHOR: (0.00, 0.00, -2.20)m</div>
    </div>
  </div>

  <!-- 右上角控制按鈕區 -->
  <div id="top-right-controls">
    <button id="btn-ar-toggle" class="top-btn">📷 開啟定錨 AR</button>
    <button id="btn-reanchor" class="top-btn">📍 重新定錨</button>
    <button id="btn-webxr" class="top-btn">🌐 WebXR 平面偵測</button>
  </div>

  <!-- 螢幕中央空間定錨準星（瞄準階段顯示） -->
  <div id="aim-reticle-hud">
    <div class="reticle-ring"></div>
    <div class="reticle-inner">
      <div class="reticle-dot"></div>
    </div>
    <div class="reticle-label">對準環境位置 · 點擊鎖定錨點</div>
  </div>

  <!-- 畫面外空間錨點方向指引雷達 -->
  <div id="offscreen-indicator">
    <span id="offscreen-arrow">◀</span>
    <span id="offscreen-text">空間錨點在左側（轉回原位即可看見）</span>
  </div>

  <!-- 系統狀態提示框 -->
  <div id="status-toast"></div>

  <!-- 實景相機視訊層 -->
  <video id="ar-camera-feed" autoplay playsinline muted></video>

  <!-- 水流沖刷雙層波浪特效層 -->
  <div id="wash-overlay">
    <div class="wash-wave primary"></div>
    <div class="wash-wave secondary"></div>
    <div id="wash-bubbles-layer"></div>
  </div>

  <!-- 中央藍色數字爆發橫幅 -->
  <div id="burst-overlay">
    <div class="burst-main-text">
      <span class="burst-drop">💧</span>
      <span id="burst-number">100,000 PSI</span>
      <span class="burst-drop">💧</span>
    </div>
    <div class="burst-sub-pill" id="burst-sub">BUBBLE WASH · STATUS CURED</div>
  </div>

  <!-- 底部操作按鈕與提示 -->
  <div id="bottom-controls">
    <button id="btn-lock-anchor">📍 鎖定空間錨點於此處</button>
    <button id="btn-trigger">🌊 發動水能量・泡泡沖刷</button>
    <div id="hint-text" class="hint-pill">👆 點擊右上角 <span>「📷 開啟定錨 AR」</span> 進入實景空間定錨</div>
  </div>

  <!-- A-Frame 3D 世界空間定錨場景 -->
  <a-scene
    id="ar-scene"
    embedded
    renderer="alpha: true; antialias: true; colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">

    <a-assets timeout="10000">
      <img id="card-tex" alt="Bubble Energy Card" />
    </a-assets>

    <!-- 鏡頭相機實體（AR 模式下由裝置陀螺儀驅動真實 360° 視角旋轉） -->
    <a-entity id="camera-rig" position="0 0 0" rotation="0 0 0">
      <a-camera id="main-camera" position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
    </a-entity>

    <!-- 場景光源 -->
    <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
    <a-light type="point" color="#00e5ff" intensity="2.2" distance="8" position="0 0.5 -1.5"></a-light>

    <!-- ==========================================
         世界座標空間錨點容器（World-Locked Spatial Anchor Node）
         一旦鎖定，其世界座標與方向將固定於真實空間中，隨手機移動產生真實視差
         ========================================== -->
    <a-entity id="world-anchor-node" position="0 0.1 -2.2" rotation="0 0 0">
      <!-- 內部縮放與微調容器 -->
      <a-entity id="anchor-content" position="0 0 0" rotation="0 0 0" scale="1 1 1">

        <!-- 3D 泡泡水能量卡主體（無藍色背板，雙面高解析貼圖） -->
        <a-plane
          id="card-plane"
          class="clickable"
          position="0 0.14 0"
          width="1.15"
          height="1.605"
          src="#card-tex"
          material="shader: flat; side: double; transparent: false"
          animation__idle="property: rotation; from: -2 -3.5 0; to: 2 3.5 0; dir: alternate; loop: true; dur: 3400; easing: easeInOutSine">
        </a-plane>

        <!-- 卡片前方 3D 水能量核心與雙層水環 -->
        <a-entity id="fx-group" position="0 0.14 0.08">
          <a-sphere
            id="water-core"
            radius="0.26"
            color="#ffffff"
            material="shader: flat; opacity: 0.34; transparent: true"
            animation="property: scale; from: 0.94 0.94 0.94; to: 1.06 1.06 1.06; dir: alternate; loop: true; dur: 1400; easing: easeInOutSine">
          </a-sphere>

          <!-- 立體金屬水滴核心 -->
          <a-entity
            id="water-drop-icon"
            position="0 0.04 0.1"
            animation="property: rotation; from: 0 -18 0; to: 0 18 0; dir: alternate; loop: true; dur: 2200; easing: easeInOutSine">
            <a-sphere
              radius="0.105"
              position="0 -0.044 0"
              color="#0077ee"
              material="metalness: 0.82; roughness: 0.15; emissive: #0099ff; emissive-intensity: 0.72">
            </a-sphere>
            <a-cone
              radius-bottom="0.104"
              radius-top="0.005"
              height="0.19"
              position="0 0.062 0"
              color="#0077ee"
              material="metalness: 0.82; roughness: 0.15; emissive: #0099ff; emissive-intensity: 0.72">
            </a-cone>
          </a-entity>

          <!-- 雙層動態水能量光環 -->

        <!-- ==========================================
             科技感「3D 空間錨點定位基座（Spatial Anchor Pin & Ground Ring）」
             清楚標示虛擬卡牌與真實空間的定錨結合點

  <script>
    // ==========================================
    // 1. 離屏繪製高解析「バブルエネルギー」特殊能量卡貼圖
    // ==========================================
    function drawWaterIcon(ctx, cx, cy, scale) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.beginPath();
      ctx.moveTo(4, -22);
      ctx.bezierCurveTo(22, 0, 18, 22, 0, 22);
      ctx.bezierCurveTo(-18, 22, -20, 2, 4, -22);
      ctx.fillStyle = '#080e14';
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(-3, 12, 6, 3, -0.35, 0, Math.PI * 2);
      ctx.fillStyle = '#24a8f0';
      ctx.fill();
      ctx.restore();
    }

    function drawGlassBubble(ctx, x, y, r, angle = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
      grad.addColorStop(0, 'rgba(200, 248, 255, 0.72)');
      grad.addColorStop(0.55, 'rgba(30, 165, 235, 0.56)');
      grad.addColorStop(0.88, 'rgba(10, 75, 130, 0.85)');
      grad.addColorStop(1, 'rgba(210, 250, 255, 0.92)');

      ctx.beginPath();
      ctx.ellipse(0, 0, r, r * 0.88, 0, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = 'rgba(220, 252, 255, 0.78)';
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(-r * 0.38, -r * 0.32, r * 0.25, r * 0.12, -0.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
      ctx.fill();
      ctx.restore();
    }

    function generateCardTextureAsset() {
      const canvas = document.createElement('canvas');
      canvas.width = 734;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      const borderGrad = ctx.createLinearGradient(0, 0, w, h);

      borderGrad.addColorStop(1, '#dde3e8');

      ctx.fillRect(0, 0, w, h);

      const innerX = 24, innerY = 24, innerW = w - 48, innerH = h - 48;
      ctx.fillStyle = '#dde4ea';
      ctx.fillRect(innerX, innerY, innerW, innerH);

      const artX = 34, artY = 148, artW = w - 68, artH = 445;
      const bgGrad = ctx.createLinearGradient(artX, artY, artX + artW, artY);
      bgGrad.addColorStop(0, '#c8e6f5');
      bgGrad.addColorStop(0.2, '#1d88c7');
      bgGrad.addColorStop(0.5, '#072a4a');
      bgGrad.addColorStop(0.8, '#1d88c7');
      bgGrad.addColorStop(1, '#c8e6f5');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(artX, artY, artW, artH);

      const stripes = [
        { y: 170, h: 18, c: 'rgba(255,255,255,0.45)' },
        { y: 215, h: 30, c: 'rgba(130,220,255,0.35)' },
        { y: 280, h: 24, c: 'rgba(15,85,145,0.55)' },
        { y: 340, h: 42, c: 'rgba(190,240,255,0.4)' },
        { y: 410, h: 26, c: 'rgba(10,60,115,0.5)' },
        { y: 470, h: 35, c: 'rgba(160,230,255,0.45)' },
        { y: 535, h: 28, c: 'rgba(255,255,255,0.35)' }
      ];
      stripes.forEach(s => {
        ctx.fillStyle = s.c;
        ctx.fillRect(artX, s.y, artW, s.h);
      });

      const cx = w / 2, cy = artY + artH / 2 + 4;
      for (let i = 0; i < 6; i++) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(i * 0.55);
        ctx.beginPath();
        ctx.ellipse(0, 0, 235 - i * 8, 195 + i * 6, 0.3, 0, Math.PI * 2);
        ctx.lineWidth = 14 - i * 1.5;
        ctx.strokeStyle = i % 2 === 0 ? 'rgba(235, 248, 255, 0.65)' : 'rgba(20, 110, 175, 0.55)';
        ctx.stroke();
        ctx.restore();
      }

      const coreR = 165;
      const coreGrad = ctx.createRadialGradient(cx - 35, cy - 35, 15, cx, cy, coreR);
      coreGrad.addColorStop(0, '#5ce1ff');
      coreGrad.addColorStop(0.55, '#139be8');
      coreGrad.addColorStop(0.88, '#085b9e');
      coreGrad.addColorStop(1, '#e1f7ff');
      ctx.beginPath();
      ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
      ctx.fillStyle = coreGrad;
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(240, 252, 255, 0.85)';
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy + 4);
      ctx.beginPath();
      ctx.moveTo(42, -118);
      ctx.bezierCurveTo(132, -5, 112, 112, -2, 112);
      ctx.bezierCurveTo(-110, 112, -115, 12, 42, -118);
      ctx.fillStyle = '#070d12';
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(-18, 65, 34, 15, -0.25, 0, Math.PI * 2);
      ctx.fillStyle = '#22a8f2';
      ctx.fill();
      ctx.restore();

      drawGlassBubble(ctx, 112, 212, 56, -0.4);
      drawGlassBubble(ctx, 68, 305, 42, 0.2);
      drawGlassBubble(ctx, 628, 225, 48, 0.5);
      drawGlassBubble(ctx, 658, 305, 32, -0.2);
      drawGlassBubble(ctx, 122, 495, 58, 0.35);
      drawGlassBubble(ctx, 615, 498, 62, -0.4);
      drawGlassBubble(ctx, 668, 412, 34, 0.1);

      const topBarGrad = ctx.createLinearGradient(0, 24, 0, 68);
      topBarGrad.addColorStop(0, '#b8c2ca');
      topBarGrad.addColorStop(0.5, '#8f9ba5');
      topBarGrad.addColorStop(1, '#aeb8c0');
      ctx.fillStyle = topBarGrad;
      ctx.fillRect(innerX, innerY, innerW, 44);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 21px "Noto Sans JP", sans-serif';
      ctx.fillText('特殊エネルギー', 44, 54);
      ctx.fillText('エネルギー', 568, 54);

      const titleGrad = ctx.createLinearGradient(0, 68, 0, 148);
      titleGrad.addColorStop(0, '#eef2f5');
      titleGrad.addColorStop(1, '#cfd7de');
      ctx.fillStyle = titleGrad;
      ctx.fillRect(innerX, 68, innerW, 80);

      ctx.fillStyle = '#11161b';
      ctx.font = 'bold 13px "Noto Sans JP", sans-serif';
      ctx.fillText('みず', 193, 86);

      ctx.font = '900 38px "Noto Sans JP", sans-serif';
      ctx.fillText('バブル', 54, 126);
      drawWaterIcon(ctx, 206, 113, 0.85);
      ctx.fillText('エネルギー', 234, 126);

      ctx.beginPath();
      ctx.arc(668, 108, 30, 0, Math.PI * 2);
      const badgeGrad = ctx.createRadialGradient(660, 100, 4, 668, 108, 30);
      badgeGrad.addColorStop(0, '#70e1ff');
      badgeGrad.addColorStop(1, '#0c8ce0');
      ctx.fillStyle = badgeGrad;
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
      drawWaterIcon(ctx, 668, 108, 0.95);

      const textBoxY = 593, textBoxH = 342;
      const boxGrad = ctx.createLinearGradient(0, textBoxY, 0, textBoxY + textBoxH);
      boxGrad.addColorStop(0, '#eef2f5');
      boxGrad.addColorStop(1, '#dce2e7');
      ctx.fillStyle = boxGrad;
      ctx.fillRect(innerX, textBoxY, innerW, textBoxH);

      ctx.strokeStyle = '#9aa5b0';
      ctx.lineWidth = 3;

      ctx.fillStyle = '#141a20';
      ctx.font = 'bold 23px "Noto Sans JP", sans-serif';
      ctx.fillText('このカードは、ポケモンについているかぎり、', 54, 672);

      ctx.font = 'bold 11px "Noto Sans JP", sans-serif';
      ctx.fillText('みず', 55, 687);
      drawWaterIcon(ctx, 66, 704, 0.52);
      ctx.font = 'bold 23px "Noto Sans JP", sans-serif';
      ctx.fillText('エネルギー1個ぶんとしてはたらく。', 82, 712);

      ctx.fillText('このカードをつけている', 54, 778);
      ctx.font = 'bold 11px "Noto Sans JP", sans-serif';
      ctx.fillText('みず', 313, 753);
      drawWaterIcon(ctx, 324, 770, 0.52);
      ctx.font = 'bold 23px "Noto Sans JP", sans-serif';
      ctx.fillText('ポケモンは、特殊状態にならず、', 340, 778);

      ctx.fillText('受けている特殊状態は、すべて回復する。', 54, 818);

      ctx.fillStyle = '#cfd7de';
      ctx.fillRect(innerX, 935, innerW, 65);

      ctx.strokeStyle = '#141a20';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(42, 952, 26, 30);
      ctx.fillStyle = '#141a20';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText('J', 49, 975);

      ctx.fillStyle = '#141a20';
      ctx.fillRect(78, 954, 46, 26);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 17px sans-serif';
      ctx.fillText('M4', 87, 973);

      ctx.fillStyle = '#141a20';
      ctx.font = 'bold 21px sans-serif';
      ctx.fillText('082/083  R', 138, 975);

      ctx.beginPath();
      ctx.arc(672, 966, 17, 0, Math.PI * 2);
      ctx.fillStyle = '#139be8';
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
      drawWaterIcon(ctx, 672, 966, 0.55);

      document.getElementById('card-tex').src = canvas.toDataURL('image/png');
    }
    generateCardTextureAsset();

    // ==========================================
    // 2. 生成 70 顆漂浮 3D 氣泡粒子
    // ==========================================
    const bubbleContainer = document.getElementById('bubble-particles');
    function createBubbles() {
      bubbleContainer.innerHTML = '';
      for (let i = 0; i < 70; i++) {
        const bubble = document.createElement('a-sphere');
        const radius = (Math.random() * 0.017 + 0.005).toFixed(4);
        const x = (Math.random() * 1.48 - 0.74).toFixed(2);
        const yStart = (Math.random() * 1.4 - 0.8).toFixed(2);
        const yEnd = (parseFloat(yStart) + 0.45 + Math.random() * 0.45).toFixed(2);
        const z = (Math.random() * 0.34 - 0.08).toFixed(2);
        const dur = Math.floor(Math.random() * 2400 + 2000);
        const color = Math.random() > 0.3 ? '#80f5ff' : '#ffffff';

        bubble.setAttribute('radius', radius);
        bubble.setAttribute('position', `${x} ${yStart} ${z}`);
        bubble.setAttribute('color', color);
        bubble.setAttribute('material', 'shader: flat; opacity: 0.78; transparent: true');
        bubble.setAttribute('animation__rise', {
          property: 'position',
          from: `${x} ${yStart} ${z}`,
          to: `${x} ${yEnd} ${z}`,
          dur: dur,
          loop: true,
          dir: 'alternate',
          easing: 'easeInOutSine'
        });
        bubbleContainer.appendChild(bubble);
      }
    }
    createBubbles();

    // ==========================================
    // 3. 泡泡沖刷波浪與能量爆發特效
    // ==========================================
    const fxGroup = document.getElementById('fx-group');
    const cardPlane = document.getElementById('card-plane');
    const burstOverlay = document.getElementById('burst-overlay');
    const washOverlay = document.getElementById('wash-overlay');
    const washBubblesLayer = document.getElementById('wash-bubbles-layer');
    const statusToast = document.getElementById('status-toast');

    let toastTimeout = null;
    function showToast(msg, duration = 3600) {
      statusToast.textContent = msg;
      statusToast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        statusToast.classList.remove('show');
      }, duration);
    }

    function triggerWashWave() {
      washOverlay.classList.remove('washing');
      void washOverlay.offsetWidth;
      washOverlay.classList.add('washing');

      washBubblesLayer.innerHTML = '';
      for (let i = 0; i < 32; i++) {

        const drift = (Math.random() * 80 - 40).toFixed(0);

        b.style.width = `${size}px`;
        b.style.height = `${size}px`;
        b.style.left = `${left}%`;
        b.style.setProperty('--dur', `${dur}s`);
        b.style.setProperty('--drift', `${drift}px`);

    function triggerBurst() {
      fxGroup.removeAttribute('animation__burst');
      setTimeout(() => {
        fxGroup.setAttribute('animation__burst', {
          property: 'scale',
          from: '1 1 1',
          to: '1.42 1.42 1.42',
          dur: 260,
          dir: 'alternate',
          loop: 1,
          easing: 'easeOutBack'
        });
      }, 10);

      cardPlane.removeAttribute('animation__washshake');
      setTimeout(() => {
        cardPlane.setAttribute('animation__washshake', {
          property: 'position',
          from: '0 0.10 0',
          to: '0 0.19 0',
          dur: 180,
          dir: 'alternate',
          loop: 2,
          easing: 'easeInOutSine'
        });
      }, 10);

      burstOverlay.classList.remove('show');
      void burstOverlay.offsetWidth;
      burstOverlay.classList.add('show');
      triggerWashWave();
    }

    document.getElementById('btn-trigger').addEventListener('click', triggerBurst);

    // ==========================================
    // 4. 真正世界座標空間定錨引擎（World-Locked Spatial Anchor）
    //    核心原理：
    //    - 裝置陀螺儀（DeviceOrientation）即時驅動 3D 相機在虛擬空間中的真實朝向（Camera Quaternion）
    //    - 瞄準階段：錨點隨鏡頭移動（跟隨相機前方 2.2 公尺處），方便使用者對準環境位置
    //    - 鎖定定錨後：錨點的世界座標（World Position）與世界朝向（World Quaternion）徹底釘死！
    //      手機左右上下移動轉向時，相機轉動但錨點留在原地，呈現 100% 真實空間定錨！
    // ==========================================
    const cameraFeed = document.getElementById('ar-camera-feed');
    const btnArToggle = document.getElementById('btn-ar-toggle');
    const btnReanchor = document.getElementById('btn-reanchor');
    const btnWebxr = document.getElementById('btn-webxr');
    const btnLockAnchor = document.getElementById('btn-lock-anchor');
    const btnTrigger = document.getElementById('btn-trigger');
    const aimReticleHud = document.getElementById('aim-reticle-hud');
    const offscreenIndicator = document.getElementById('offscreen-indicator');
    const offscreenArrow = document.getElementById('offscreen-arrow');
    const offscreenText = document.getElementById('offscreen-text');

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const coordReadout = document.getElementById('coord-readout');
    const hintText = document.getElementById('hint-text');

    const cameraRig = document.getElementById('camera-rig');
    const mainCamera = document.getElementById('main-camera');
    const worldAnchorNode = document.getElementById('world-anchor-node');
    const anchorContent = document.getElementById('anchor-content');

    // AR 狀態機：'PREVIEW' | 'AIMING' | 'LOCKED'
    let arState = 'PREVIEW';
    let cameraStream = null;
    let gyroEnabled = false;

    // 裝置姿態四元數計算（標準 W3C DeviceOrientation -> Three.js Camera Quaternion）
    const zee = new THREE.Vector3(0, 0, 1);
    const euler = new THREE.Euler();
    const q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // -PI/2 around X
    const targetCamQuat = new THREE.Quaternion();
    const currentCamQuat = new THREE.Quaternion();

    let latestOrientation = { alpha: 0, beta: 90, gamma: 0, screenAngle: 0 };
    let hasReceivedGyro = false;

    // 定錨距離與微調參數
    let anchorDistance = 2.2;
    let anchorScale = 1.0;
    let previewRot = { x: 0, y: 0 };

    function setDeviceQuaternion(quat, alpha, beta, gamma, orient) {
      euler.set(beta, alpha, -gamma, 'YXZ');
      quat.setFromEuler(euler);
      quat.multiply(q1);
      quat.multiply(q0.setFromAxisAngle(zee, -orient));
    }

    function onDeviceOrientation(e) {
      if (e.alpha === null || e.beta === null || e.gamma === null) return;
      hasReceivedGyro = true;
      const screenAngle = (window.screen && window.screen.orientation && window.screen.orientation.angle)
        || window.orientation || 0;

      latestOrientation.alpha = THREE.MathUtils.degToRad(e.alpha);
      latestOrientation.beta = THREE.MathUtils.degToRad(e.beta);
      latestOrientation.gamma = THREE.MathUtils.degToRad(e.gamma);
      latestOrientation.screenAngle = THREE.MathUtils.degToRad(screenAngle);

      setDeviceQuaternion(
        targetCamQuat,
        latestOrientation.alpha,
        latestOrientation.beta,
        latestOrientation.gamma,
        latestOrientation.screenAngle
      );
    }

    async function requestGyroPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res === 'granted') {
            window.addEventListener('deviceorientation', onDeviceOrientation, true);
            gyroEnabled = true;
            return true;
          }
          return false;
        } catch (_) {
          return false;
        }
      } else if ('ondeviceorientation' in window) {
        window.addEventListener('deviceorientation', onDeviceOrientation, true);
        gyroEnabled = true;
        return true;
      }
      return false;
    }

    // 更新 HUD 狀態顯示
    function updateHudState() {
      if (arState === 'PREVIEW') {
        statusDot.className = 'status-dot';
        statusText.textContent = '3D 預覽模式（可開啟鏡頭定錨）';
        aimReticleHud.classList.remove('visible');
        offscreenIndicator.classList.remove('visible');
        btnLockAnchor.style.display = 'none';
        btnTrigger.style.display = 'flex';
        btnReanchor.style.display = 'none';
        hintText.innerHTML = '👆 點擊右上角 <span>「📷 開啟定錨 AR」</span> 進入實景空間定錨';
      } else if (arState === 'AIMING') {
        statusDot.className = 'status-dot aiming';
        statusText.textContent = '🟡 瞄準環境中 · 請點擊鎖定空間錨點';
        aimReticleHud.classList.add('visible');
        offscreenIndicator.classList.remove('visible');
        btnLockAnchor.style.display = 'flex';
        btnTrigger.style.display = 'none';
        btnReanchor.style.display = 'none';
        hintText.innerHTML = '🎯 移動手機對準真實空間位置，按下 <span>「📍 鎖定空間錨點」</span>';
      } else if (arState === 'LOCKED') {
        statusDot.className = 'status-dot locked';
        statusText.textContent = '🟢 已定錨於真實世界座標（World-Locked）';
        aimReticleHud.classList.remove('visible');
        btnLockAnchor.style.display = 'none';
        btnTrigger.style.display = 'flex';
        btnReanchor.style.display = 'flex';
        hintText.innerHTML = '📱 轉動手機測試空間定錨！點擊卡片可 <span>發動水能量</span>';
      }
    }

    // 將錨點放置於當前鏡頭正前方指定距離，並面向使用者
    function placeAnchorInFrontOfCamera(lockNow = false) {
      if (!cameraRig.object3D || !worldAnchorNode.object3D) return;

      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(cameraRig.object3D.quaternion).normalize();
      const targetPos = forward.clone().multiplyScalar(anchorDistance);
      targetPos.y -= 0.08; // 讓卡片視覺中心對齊準星正中央

      worldAnchorNode.object3D.position.copy(targetPos);

      // 讓卡片水平面向相機方向（保持垂直站立姿態，符合真實卡片定錨習慣）
      const lookTarget = new THREE.Vector3(0, targetPos.y, 0);
      worldAnchorNode.object3D.lookAt(lookTarget);

      if (lockNow) {
        arState = 'LOCKED';
        updateHudState();
        triggerBurst();
        showToast('📍 已鎖定空間錨點！現在左右轉動手機，卡片會留在原本定錨的真實位置！', 4000);
      }
    }

    // 點擊卡片互動（預覽或鎖定狀態下發動特效；瞄準狀態下直接鎖定定錨）
    cardPlane.addEventListener('click', () => {
      if (hasDragged) return;
      if (arState === 'AIMING') {
        placeAnchorInFrontOfCamera(true);
      } else {
        triggerBurst();
      }
    });

    // 點擊畫面空白處（瞄準狀態下可直接點擊螢幕任意處完成定錨）
    document.getElementById('ar-scene').addEventListener('click', (e) => {
      if (arState === 'AIMING' && !hasDragged) {
        placeAnchorInFrontOfCamera(true);
      }
    });

    btnLockAnchor.addEventListener('click', (e) => {
      e.stopPropagation();
      placeAnchorInFrontOfCamera(true);
    });

    btnReanchor.addEventListener('click', (e) => {
      e.stopPropagation();
      arState = 'AIMING';
      updateHudState();
      showToast('🎯 已解除定錨，請將準星對準新的空間位置並點擊鎖定！', 3000);
    });

    // ==========================================
    // 5. 60FPS 主渲染迴圈：驅動相機空間視角 + 檢測錨點是否在視野內
    // ==========================================
    const tempAnchorPos = new THREE.Vector3();
    const tempLocalPos = new THREE.Vector3();

    function updateSpatialLoop() {
      if (arState === 'AIMING' || arState === 'LOCKED') {
        if (hasReceivedGyro) {
          // 平滑更新相機在真實世界中的 360° 旋轉姿態
          currentCamQuat.slerp(targetCamQuat, 0.22);
          cameraRig.object3D.quaternion.copy(currentCamQuat);
        }

        if (arState === 'AIMING') {
          // 瞄準階段：讓半透明預覽卡片跟隨準星位置移動
          placeAnchorInFrontOfCamera(false);
        } else if (arState === 'LOCKED') {
          // 鎖定階段：worldAnchorNode 的世界座標保持不動！
          // 計算錨點相對於目前手機鏡頭的方位，若轉開鏡頭移出視野，顯示邊緣方向指引雷達
          tempAnchorPos.copy(worldAnchorNode.object3D.position);
          tempLocalPos.copy(tempAnchorPos).applyQuaternion(cameraRig.object3D.quaternion.clone().invert());

          // tempLocalPos.z < 0 代表在鏡頭前方；計算水平夾角
          const angleYaw = THREE.MathUtils.radToDeg(Math.atan2(tempLocalPos.x, -tempLocalPos.z));
          const anglePitch = THREE.MathUtils.radToDeg(Math.atan2(tempLocalPos.y, -tempLocalPos.z));

          if (Math.abs(angleYaw) > 26 || Math.abs(anglePitch) > 34 || tempLocalPos.z > 0) {
            offscreenIndicator.classList.add('visible');
            if (angleYaw < -12) {
              offscreenArrow.textContent = '◀';
              offscreenText.textContent = `空間錨點在左側 (${Math.abs(Math.round(angleYaw))}°)`;
            } else if (angleYaw > 12) {
              offscreenArrow.textContent = '▶';
              offscreenText.textContent = `空間錨點在右側 (${Math.abs(Math.round(angleYaw))}°)`;
            } else if (anglePitch > 12) {
              offscreenArrow.textContent = '▲';
              offscreenText.textContent = '空間錨點在上方（抬高手機）';
            } else {
              offscreenArrow.textContent = '▼';
              offscreenText.textContent = '空間錨點在下方（降低手機）';
            }
          } else {
            offscreenIndicator.classList.remove('visible');
          }
        }
      } else {
        // 3D 預覽模式：相機歸零，卡片在正前方接受滑鼠/單指旋轉檢視
        cameraRig.object3D.quaternion.identity();
        worldAnchorNode.object3D.position.set(0, 0.1, -2.2);
        worldAnchorNode.object3D.rotation.set(
          THREE.MathUtils.degToRad(previewRot.x),
          THREE.MathUtils.degToRad(previewRot.y),
          0
        );
      }

      // 更新左上角即時世界座標讀數
      if (worldAnchorNode.object3D) {
        const p = worldAnchorNode.object3D.position;
        coordReadout.textContent = `ANCHOR: (${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)})m`;
      }

      requestAnimationFrame(updateSpatialLoop);
    }
    requestAnimationFrame(updateSpatialLoop);

    // ==========================================
    // 6. 觸控與滑鼠手勢（預覽旋轉 / 鎖定後微調位置與雙指縮放）
    // ==========================================
    let isDragging = false;
    let hasDragged = false;
    let pointerStart = { x: 0, y: 0 };
    let initialPinchDist = null;
    let initialScale = 1.0;

    function getTouchDist(t1, t2) {
      return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    }

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        hasDragged = false;
        pointerStart.x = e.touches[0].clientX;
        pointerStart.y = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDist = getTouchDist(e.touches[0], e.touches[1]);
        initialScale = anchorScale;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDragging) {
        const dx = e.touches[0].clientX - pointerStart.x;
        const dy = e.touches[0].clientY - pointerStart.y;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) hasDragged = true;

        if (arState === 'PREVIEW') {
          previewRot.y = Math.max(-55, Math.min(55, previewRot.y + dx * 0.35));
          previewRot.x = Math.max(-40, Math.min(40, previewRot.x + dy * 0.35));
        } else if (arState === 'LOCKED') {
          // 鎖定狀態下，單指拖曳可微調錨點在世界空間中的前後/高度位置
          const right = new THREE.Vector3(1, 0, 0).applyQuaternion(cameraRig.object3D.quaternion);
          worldAnchorNode.object3D.position.addScaledVector(right, dx * 0.003);
          worldAnchorNode.object3D.position.y -= dy * 0.003;
        }
        pointerStart.x = e.touches[0].clientX;
        pointerStart.y = e.touches[0].clientY;
      } else if (e.touches.length === 2 && initialPinchDist) {
        const dist = getTouchDist(e.touches[0], e.touches[1]);
        anchorScale = Math.max(0.55, Math.min(1.85, initialScale * (dist / initialPinchDist)));
        anchorContent.object3D.scale.set(anchorScale, anchorScale, anchorScale);
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      isDragging = false;
      initialPinchDist = null;
      setTimeout(() => { hasDragged = false; }, 60);
    }, { passive: true });

    // 電腦版滑鼠拖曳支援（方便無陀螺儀環境測試空間定錨視角）
    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      hasDragged = false;
      pointerStart.x = e.clientX;
      pointerStart.y = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - pointerStart.x;
      const dy = e.clientY - pointerStart.y;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) hasDragged = true;

      if (arState === 'PREVIEW') {
        previewRot.y = Math.max(-55, Math.min(55, previewRot.y + dx * 0.35));
        previewRot.x = Math.max(-40, Math.min(40, previewRot.x + dy * 0.35));
      } else if (!hasReceivedGyro && (arState === 'AIMING' || arState === 'LOCKED')) {
        // 電腦版模擬相機轉頭測試定錨
        const yawEuler = new THREE.Euler(0, -dx * 0.004, 0, 'YXZ');
        const pitchEuler = new THREE.Euler(-dy * 0.004, 0, 0, 'YXZ');
        targetCamQuat.multiply(new THREE.Quaternion().setFromEuler(yawEuler));
        targetCamQuat.multiply(new THREE.Quaternion().setFromEuler(pitchEuler));
        currentCamQuat.copy(targetCamQuat);
        cameraRig.object3D.quaternion.copy(currentCamQuat);
      }
      pointerStart.x = e.clientX;
      pointerStart.y = e.clientY;
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
      setTimeout(() => { hasDragged = false; }, 60);
    });

    // ==========================================
    // 7. 開啟 / 關閉實景相機定錨 AR 模式
    // ==========================================
    function stopRearCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
      }
      cameraFeed.srcObject = null;
      cameraFeed.style.display = 'none';
    }

    btnArToggle.addEventListener('click', async () => {
      if (arState === 'PREVIEW') {
        try {
          btnArToggle.textContent = '啟動相機中...';

          // 1. 請求裝置方向感測器權限（支援 iOS Safari 與 Android Chrome）
          const gyroOk = await requestGyroPermission();

          // 2. 開啟後方實景鏡頭
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error('CAMERA_UNSUPPORTED');
          }
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: 'environment' },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            },
            audio: false
          });

          cameraFeed.srcObject = cameraStream;
          await cameraFeed.play();
          cameraFeed.style.display = 'block';

          document.body.classList.add('ar-active');
          btnArToggle.textContent = '⬛ 結束定錨 AR';
          btnArToggle.classList.add('active');

          // 進入「瞄準定錨階段」
          arState = 'AIMING';
          updateHudState();

          if (!gyroOk) {
            showToast('⚠️ 未取得陀螺儀權限，可使用單指滑動模擬空間視角轉動。', 4000);
          } else {
            showToast('🎯 相機已開啟！請對準真實環境位置，按下方「鎖定空間錨點」釘住卡片！', 4000);
          }
        } catch (err) {
          stopRearCamera();
          arState = 'PREVIEW';
          document.body.classList.remove('ar-active');
          btnArToggle.textContent = '📷 開啟定錨 AR';
          btnArToggle.classList.remove('active');
          updateHudState();
          showToast('⚠️ 無法開啟相機（請確認使用 Safari 或 Chrome 並允許相機權限）。', 4000);
        }
      } else {
        stopRearCamera();
        arState = 'PREVIEW';
        document.body.classList.remove('ar-active');
        btnArToggle.textContent = '📷 開啟定錨 AR';
        btnArToggle.classList.remove('active');
        anchorScale = 1.0;
        anchorContent.object3D.scale.set(1, 1, 1);
        updateHudState();
        showToast('已返回 3D 預覽模式', 2000);
      }
    });

    // 偵測瀏覽器是否支援原生 WebXR 平面偵測（Android Chrome 進階加分支援）
    if (navigator.xr && navigator.xr.isSessionSupported) {
      navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
        if (supported) {
          btnWebxr.style.display = 'flex';
          btnWebxr.addEventListener('click', () => {
            const sceneEl = document.getElementById('ar-scene');
            if (sceneEl && sceneEl.enterAR) {
              stopRearCamera();
              sceneEl.enterAR();
            }
          });
        }
      }).catch(() => {});
    }

    // 初始化狀態
    updateHudState();
  </script>
</body>
</html>
